<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder orbital earth background</title>
  <desc id="desc">A cinematic placeholder image of Earth at night from orbit with stars, city lights, and sunrise flare. Replace with licensed footage or imagery when available.</desc>
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="12%" r="68%">
      <stop offset="0%" stop-color="#7fb9ff" stop-opacity=".62"/>
      <stop offset="20%" stop-color="#234b82" stop-opacity=".52"/>
      <stop offset="55%" stop-color="#061226" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="18%" r="18%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="8%" stop-color="#dff3ff" stop-opacity=".95"/>
      <stop offset="23%" stop-color="#75b7ff" stop-opacity=".45"/>
      <stop offset="58%" stop-color="#1d4f90" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#1d4f90" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#8fd9ff" stop-opacity=".86"/>
      <stop offset="18%" stop-color="#2d7fc2" stop-opacity=".54"/>
      <stop offset="42%" stop-color="#071c35" stop-opacity=".94"/>
      <stop offset="100%" stop-color="#02030a"/>
    </linearGradient>
    <radialGradient id="earthShade" cx="52%" cy="68%" r="62%">
      <stop offset="0%" stop-color="#132a43"/>
      <stop offset="48%" stop-color="#07101e"/>
      <stop offset="86%" stop-color="#02040a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="stars" width="130" height="130" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="21" r="1.1" fill="#fff" opacity=".78"/>
      <circle cx="43" cy="85" r=".8" fill="#c9e5ff" opacity=".48"/>
      <circle cx="89" cy="34" r="1.4" fill="#fff" opacity=".58"/>
      <circle cx="115" cy="108" r=".7" fill="#fff" opacity=".38"/>
      <circle cx="68" cy="9" r=".6" fill="#fff" opacity=".32"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#skyGlow)"/>
  <rect width="1600" height="900" fill="url(#stars)" opacity=".72"/>
  <rect y="0" width="1600" height="900" fill="url(#sun)"/>
  <path d="M0 204 H1600" stroke="#9fd6ff" stroke-opacity=".62" stroke-width="2" filter="url(#softBlur)"/>
  <path d="M0 204 H1600" stroke="#dff4ff" stroke-opacity=".42" stroke-width="1"/>

  <ellipse cx="800" cy="790" rx="980" ry="520" fill="url(#earthShade)"/>
  <path d="M-130 485 C220 330 510 292 800 293 C1090 292 1380 330 1730 485" fill="none" stroke="#89d7ff" stroke-opacity=".72" stroke-width="18" filter="url(#softBlur)"/>
  <path d="M-120 486 C228 344 520 313 800 313 C1080 313 1372 344 1720 486" fill="none" stroke="#5fb5eb" stroke-opacity=".75" stroke-width="5"/>
  <path d="M-90 500 C248 376 530 346 800 346 C1070 346 1352 376 1690 500" fill="none" stroke="#bfefff" stroke-opacity=".26" stroke-width="2"/>

  <g opacity=".18" fill="#315f75">
    <path d="M211 679 C297 617 416 602 515 638 C611 673 676 638 771 604 C900 557 1036 577 1128 645 C1220 714 1330 715 1443 670 L1516 900 H121  Z"/>
    <path d="M745 420 C790 390 854 389 905 421 C957 455 1016 454 1072 430 C1019 487 930 513 840 497 C794 489 760 463 745 420Z"/>
  </g>

  <circle cx="800" cy="196" r="25" fill="#fff"/>
  <circle cx="800" cy="196" r="86" fill="#94d6ff" opacity=".32" filter="url(#softBlur)"/>
  <path d="M582 196 H1018" stroke="#e8f8ff" stroke-opacity=".55" stroke-width="3" filter="url(#softBlur)"/>
  <path d="M750 113 L850 279" stroke="#dff4ff" stroke-opacity=".20" stroke-width="2" filter="url(#softBlur)"/>

  <rect width="1600" height="900" fill="#020207" opacity=".12"/>
